    <script>
      // Safeguard against scripts or browser extensions attempting to assign window.fetch when fetch is getter-only
      (function() {
        try {
          var target = window;
          while (target) {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc) {
              if (!desc.set && desc.configurable) {
                var currentFetch = window.fetch;
                Object.defineProperty(target, 'fetch', {
                  get: function() { return currentFetch; },
                  set: function(val) { currentFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              }
              break;
            }
            target = Object.getPrototypeOf(target);
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
